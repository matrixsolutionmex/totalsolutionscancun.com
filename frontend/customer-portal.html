<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Total Solutions | Portal del cliente</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #102032; background: #e8fff4; }
    body { margin: 0; min-height: 100vh; background: #e8fff4; }
    main { width: min(100% - 32px, 960px); margin: 32px auto; }
    header, section { background: #fff; border: 1px solid #dbe5ee; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    h1, h2 { margin: 0 0 8px; }
    p { color: #667085; }
    .hidden { display: none !important; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .item { border: 1px solid #dbe5ee; border-radius: 8px; padding: 14px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .button { display: inline-block; border: 0; border-radius: 6px; padding: 11px 16px; background: #16a34a; color: #fff; text-decoration: none; font-weight: 700; cursor: pointer; }
    .button.secondary { background: #334155; }
    .muted { color: #667085; }
    @media (max-width: 480px) { main { width: min(100% - 20px, 960px); margin: 12px auto; } header, section { padding: 16px; } }
  </style>
</head>
<body>
  <p id="portal-loading" class="muted" role="status" aria-live="polite">Cargando...</p>
  <main id="customer-portal" class="hidden" aria-live="polite">
    <header>
      <h1 data-i18n="title">Panel del cliente</h1>
      <p data-i18n="subtitle">Consulta tus solicitudes y propiedades vinculadas.</p>
      <div class="actions">
        <a class="button" id="newRequest" href="/solicitar-servico?customer_portal=1" data-i18n="newRequest">Nueva solicitud</a>
        <button class="button secondary" id="customerLogout" type="button" data-i18n="logout">Cerrar sesión</button>
      </div>
    </header>
    <section>
      <h2 data-i18n="services">Mis solicitudes</h2>
      <div id="services" class="grid"></div>
      <p id="empty" class="muted hidden" data-i18n="empty">No hay solicitudes vinculadas.</p>
    </section>
    <section id="service-detail" class="hidden" aria-live="polite">
      <div class="actions"><button class="button secondary" id="closeDetail" type="button" data-i18n="backToList">Voltar</button></div>
      <h2 id="detail-title"></h2>
      <div id="detail-content" class="muted"></div>
    </section>
    <section>
      <h2 data-i18n="properties">Mis propiedades</h2>
      <div id="properties" class="grid"></div>
    </section>
  </main>
  <script>
    (() => {
      const panel = document.getElementById("customer-portal");
      const loading = document.getElementById("portal-loading");
      const services = document.getElementById("services");
      const properties = document.getElementById("properties");
      const empty = document.getElementById("empty");
      const detail = document.getElementById("service-detail");
      const detailTitle = document.getElementById("detail-title");
      const detailContent = document.getElementById("detail-content");
      const closeDetail = document.getElementById("closeDetail");
      const copy = {
        es: { title: "Panel del cliente", subtitle: "Consulta tus solicitudes y propiedades vinculadas.", newRequest: "Nueva solicitud", logout: "Cerrar sesión", loggingOut: "Cerrando sesión...", services: "Mis solicitudes", properties: "Mis propiedades", empty: "No hay solicitudes vinculadas.", track: "Acompañar", details: "Ver detalles", backToList: "Volver", technician: "Técnico", payment: "Pago", documents: "Documentos" },
        en: { title: "Customer dashboard", subtitle: "View your linked requests and properties.", newRequest: "New request", logout: "Log out", loggingOut: "Logging out...", services: "My requests", properties: "My properties", empty: "No linked requests.", track: "Track service", details: "View details", backToList: "Back", technician: "Technician", payment: "Payment", documents: "Documents" },
        pt: { title: "Painel do cliente", subtitle: "Consulte suas solicitações e imóveis vinculados.", newRequest: "Nova solicitação", logout: "Sair", loggingOut: "Saindo...", services: "Minhas solicitações", properties: "Meus imóveis", empty: "Nenhuma solicitação vinculada.", loading: "Carregando...", track: "Acompanhar", details: "Ver detalhes", backToList: "Voltar", technician: "Técnico", payment: "Pagamento", documents: "Documentos" }
      };
      copy.es.loading = "Cargando...";
      copy.en.loading = "Loading...";
      const requestedLanguage = new URLSearchParams(window.location.search).get("lang") || navigator.language || "es";
      const language = requestedLanguage.toLowerCase().startsWith("pt") ? "pt" : requestedLanguage.toLowerCase().startsWith("en") ? "en" : "es";
      const logoutButton = document.getElementById("customerLogout");
      const newRequest = document.getElementById("newRequest");
      const clearLegacyStorage = () => {
        try {
          for (const key of Object.keys(localStorage)) {
            if (key.startsWith("totalsolutions_") && !["totalsolutions_language", "totalsolutions_public_language"].includes(key)) localStorage.removeItem(key);
          }
          sessionStorage.clear();
        } catch (_error) {
          // Storage may be unavailable; cookie revocation remains authoritative.
        }
      };
      const csrfCookie = () => document.cookie.split(";").map((part) => part.trim()).find((part) => part.startsWith("ts_csrf="))?.slice("ts_csrf=".length) || "";
      const loginUrl = () => `/?next=${encodeURIComponent("/cliente")}&lang=${encodeURIComponent(requestedLanguage)}`;
      clearLegacyStorage();
      const redirectToLogin = () => {
        window.location.replace(`/?next=${encodeURIComponent("/cliente")}&lang=${encodeURIComponent(requestedLanguage)}`);
      };
      document.documentElement.lang = language;
      document.querySelectorAll("[data-i18n]").forEach((node) => { node.textContent = copy[language][node.dataset.i18n] || node.textContent; });
      newRequest.addEventListener("click", (event) => {
        event.currentTarget.href = "/solicitar-servico?customer_portal=1&lang=" + encodeURIComponent(language === "pt" ? "pt" : language);
      });
      logoutButton.addEventListener("click", async () => {
        if (logoutButton.disabled) return;
        logoutButton.disabled = true;
        logoutButton.textContent = copy[language].loggingOut;
        loading.textContent = copy[language].loggingOut;
        loading.classList.remove("hidden");
        panel.classList.add("hidden");
        services.replaceChildren();
        properties.replaceChildren();
        try {
          await fetch("/auth/logout", {
            method: "POST",
            credentials: "same-origin",
            headers: csrfCookie() ? { "X-CSRF-Token": decodeURIComponent(csrfCookie()) } : {}
          });
        } catch (_error) {
          // Redirect regardless: a failed logout must not leave stale data visible.
        } finally {
          clearLegacyStorage();
          window.location.replace(loginUrl());
        }
      });
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[char]));
      const render = (data) => {
        loading.classList.add("hidden");
        panel.classList.remove("hidden");
        services.innerHTML = (data.services || []).map((service) => `<article class="item"><strong>${escapeHtml(service.order_number || `#${service.id}`)}</strong><div>${escapeHtml(service.service_category || "")}</div><div class="muted">${escapeHtml(service.status || "")}</div><div class="muted">${escapeHtml(service.property?.profile_type || "")} · ${escapeHtml(service.property?.locality || "")}</div><div class="muted">${escapeHtml(copy[language].technician)}: ${escapeHtml(service.technician || "-")}</div><div class="muted">${escapeHtml(copy[language].payment)}: ${escapeHtml(service.payment_status || "-")}</div>${service.documents?.length ? `<div class="muted">${escapeHtml(copy[language].documents)}: ${service.documents.length}</div>` : ""}<div class="actions"><a class="button secondary" href="/cliente?service_request_id=${encodeURIComponent(service.service_request_id)}&lang=${encodeURIComponent(language)}">${escapeHtml(copy[language].details)}</a>${service.tracking_url ? `<a class="button secondary" href="${escapeHtml(service.tracking_url)}">${escapeHtml(copy[language].track)}</a>` : ""}</div></article>`).join("");
        properties.innerHTML = (data.properties || []).map((property) => `<article class="item"><strong>${escapeHtml(property.profile_type || "")}</strong><div class="muted">${escapeHtml(property.locality || "")}</div></article>`).join("");
        empty.classList.toggle("hidden", Boolean(data.services?.length));
      };
      const renderDetail = (data) => {
        detailTitle.textContent = data.order_number || `#${data.id}`;
        detailContent.innerHTML = `<div>${escapeHtml(data.service_category || "")}</div><div>${escapeHtml(data.status || "")}</div><div>${escapeHtml(data.property?.profile_type || "")} · ${escapeHtml(data.property?.locality || "")}</div><div>${escapeHtml(copy[language].technician)}: ${escapeHtml(data.technician || "-")}</div><div>${escapeHtml(copy[language].payment)}: ${escapeHtml(data.payment_status || "-")}</div>`;
        detail.classList.remove("hidden");
      };
      const validDashboardPayload = (data) => Boolean(
        data && Array.isArray(data.services) && Array.isArray(data.properties)
      );
      let refreshTimer = null;
      const fetchWithTimeout = (url, options = {}, timeoutMs = 10000) => {
        const controller = new AbortController();
        const timer = window.setTimeout(() => controller.abort(), timeoutMs);
        return fetch(url, { ...options, signal: controller.signal }).finally(() => window.clearTimeout(timer));
      };
      const refreshDashboard = async () => {
        const response = await fetchWithTimeout("/customer-portal/me/dashboard", { credentials: "same-origin" });
        if (response.status === 401) {
          redirectToLogin();
          return;
        }
        if (!response.ok) throw new Error("dashboard");
        const data = await response.json();
        if (!validDashboardPayload(data)) throw new Error("dashboard-payload");
        newRequest.href = data.new_request_url || newRequest.href;
        render(data);
      };
      closeDetail.addEventListener("click", () => {
        detail.classList.add("hidden");
        const url = new URL(window.location.href);
        url.searchParams.delete("service_request_id");
        history.replaceState({}, "", url);
      });
      const requestedServiceRequestId = new URLSearchParams(window.location.search).get("service_request_id");
      loading.textContent = copy[language].loading;
      fetchWithTimeout("/customer-portal/config", { credentials: "same-origin" })
        .then((response) => {
          if (response.status === 401) {
            redirectToLogin();
            throw new Error("unauthenticated");
          }
          return response.ok ? response.json() : Promise.reject(new Error("config"));
        })
        .then((config) => config.customer_portal_enabled ? fetchWithTimeout("/customer-portal/me/dashboard", { credentials: "same-origin" }) : Promise.reject(new Error("disabled")))
        .then((response) => response.ok ? response.json() : Promise.reject(new Error("dashboard")))
        .then((data) => validDashboardPayload(data) ? data : Promise.reject(new Error("dashboard-payload")))
        .then((data) => {
          newRequest.href = data.new_request_url || newRequest.href;
          render(data);
          if (requestedServiceRequestId && /^\d+$/.test(requestedServiceRequestId)) {
            fetchWithTimeout(`/customer-portal/me/service-requests/${encodeURIComponent(requestedServiceRequestId)}`, { credentials: "same-origin" })
              .then((response) => response.ok ? response.json() : Promise.reject(new Error("detail")))
              .then(renderDetail)
              .catch(() => { detail.classList.add("hidden"); });
          }
          refreshTimer = window.setInterval(() => {
            if (!document.hidden) refreshDashboard().catch(() => {});
          }, 30000);
        })
        .catch(() => { loading.classList.add("hidden"); panel.classList.add("hidden"); });
      window.addEventListener("pagehide", () => { if (refreshTimer) window.clearInterval(refreshTimer); });
    })();
  </script>
</body>
</html>
