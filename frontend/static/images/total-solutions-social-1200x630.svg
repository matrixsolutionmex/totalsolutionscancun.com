<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Total Solutions Cancún</title>
  <desc id="desc">Imagen social oficial de Total Solutions Cancún para mantenimiento y soluciones profesionales.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="0.48" stop-color="#0b1724"/>
      <stop offset="1" stop-color="#123b47"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
